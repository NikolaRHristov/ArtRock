[package]
name = "ArtRock"
version = "0.1.0"
edition = "2021"
authors = ["AI Generated <chatgpt@openai.com>"]
description = "WASM module for procedural rock generation"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "rlib"] # "rlib" for testing

[dependencies]
wasm-bindgen = "0.2.87"
noise = "0.9.0"
nalgebra = "0.33.2"
rayon = "1.10.0"
js-sys = "0.3.77"
console_error_panic_hook = { version = "0.1.7", optional = true }
serde = { version = "1.0.188", features = ["derive"] }
serde-wasm-bindgen = "0.6.3"

[features]
default = ["console_error_panic_hook"]
